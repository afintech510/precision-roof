name = "precision-roof"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
# Deployed as a Cloudflare Worker via @astrojs/cloudflare (Workers static-assets
# model, not Pages — the adapter reserves the ASSETS binding). Do NOT set
# pages_build_output_dir here or wrangler treats it as a Pages project.

# Operational store — Cloudflare D1 (spec §1.2, §2.5).
# Create the database once (pre-flight) and paste the returned id below:
#   npx wrangler d1 create precision-roof-op
# Migrations live in ./migrations (Phase 02 authors the schema).
[[d1_databases]]
binding = "OP_STORE"
database_name = "precision-roof-op"
database_id = "1a4c5b80-adda-42f9-8231-0ac1398c7f7d"
migrations_dir = "migrations"

# Durable Object for the per-phone/budget/suppression SMS-send authority (spec
# §1.2, §3.1, [C2-003, C2-004, C2-033]) — pure core + thin DO class are built
# and unit-tested (src/server/sms-authority.ts, src/durable-objects/sms-authority-do.ts).
# Declared here for completeness; NOT actually wired into a deployed Worker —
# the @astrojs/cloudflare adapter's generated entry only exports `fetch`, with
# no built-in mechanism to also re-export a custom DO class or a `queue()`
# handler. Binding this for real requires a custom Worker entry wrapper (see
# docs/build/PROPOSAL-api-wiring.md addendum); deferred until that composition
# decision is made and Adam approves a deploy.
[[durable_objects.bindings]]
name = "SMS_AUTHORITY"
class_name = "SmsAuthorityDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SmsAuthorityDO"]

# Pricing-blob cache — Cloudflare KV (spec §3.2 [C2-023]). /api/webhooks/sanity-
# publish materializes the blob here; /api/quote reads it (and falls back to an
# in-process build from CMS content if empty, so it never fails closed).
# Create once:  npx wrangler kv namespace create PRICING_KV
# then paste the returned id below (id left blank until provisioned).
[[kv_namespaces]]
binding = "PRICING_KV"
id = "6d4e1b359dc749248ebc839f4adbf016"

# Astro session store (the @astrojs/cloudflare adapter auto-binds SESSION).
[[kv_namespaces]]
binding = "SESSION"
id = "e9963bba7d7e494599066f84d01fb765"

# Speed-to-lead SMS dispatch queue (spec §3.1, BUILDPLAN Phase 05b) — producer
# binding used by /api/lead + slo-sweep; the consumer entry below names a
# `queue()` handler that does not yet exist in any deployed Worker entry point
# for the same reason as the DO above (see docs/build/PROPOSAL-api-wiring.md
# addendum). Declared for completeness, not deployed.
[[queues.producers]]
binding = "SMS_QUEUE"
queue = "sms-dispatch"

[[queues.consumers]]
queue = "sms-dispatch"
max_batch_size = 10
max_retries = 3

# R2 is added by the phase that introduces it.
