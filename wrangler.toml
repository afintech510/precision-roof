name = "precision-roof"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
# Deployed as a Cloudflare Worker via @astrojs/cloudflare (Workers static-assets
# model, not Pages — the adapter reserves the ASSETS binding). Do NOT set
# pages_build_output_dir here or wrangler treats it as a Pages project.

# Operational store — Cloudflare D1 (spec §1.2, §2.5).
# Create the database once (pre-flight) and paste the returned id below:
#   npx wrangler d1 create precision-roof-op
# Migrations live in ./migrations (Phase 02 authors the schema).
[[d1_databases]]
binding = "OP_STORE"
database_name = "precision-roof-op"
database_id = "1a4c5b80-adda-42f9-8231-0ac1398c7f7d"
migrations_dir = "migrations"

# Durable Object for the per-phone/budget/suppression authority (spec §3.1)
# is declared in Phase 05b, not here.

# Pricing-blob cache — Cloudflare KV (spec §3.2 [C2-023]). /api/webhooks/sanity-
# publish materializes the blob here; /api/quote reads it (and falls back to an
# in-process build from CMS content if empty, so it never fails closed).
# Create once:  npx wrangler kv namespace create PRICING_KV
# then paste the returned id below (id left blank until provisioned).
[[kv_namespaces]]
binding = "PRICING_KV"
id = "6d4e1b359dc749248ebc839f4adbf016"

# Astro session store (the @astrojs/cloudflare adapter auto-binds SESSION).
[[kv_namespaces]]
binding = "SESSION"
id = "e9963bba7d7e494599066f84d01fb765"

# R2 / Queues + the Durable Object (per-phone/budget/suppression authority, Phase
# 05b) are added by the phases that introduce them.
